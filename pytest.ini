[pytest]
# Основна конфігурація pytest

# Мінімальна версія Python
minversion = 7.0

# Шляхи до тестових файлів
testpaths = tests

# Патерни для пошуку тестів
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose вивід
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov=main
    --cov-report=html
    --cov-report=term-missing
    --maxfail=5
    -ra

# Маркери для тестів
markers =
    auth: Authentication related tests
    sport: Sport complex related tests
    ecommerce: E-commerce related tests
    db_queries: Database query related tests
    frontend: Frontend integration tests
    slow: Slow running tests
    integration: Integration tests
    unit: Unit tests
